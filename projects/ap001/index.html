    <script>
        (function() {
            // 取得瀏覽器語系設定，預設為 en-us
            const userLang = (navigator.language || navigator.userLanguage || 'en-us').toLowerCase();
            let target = 'en-us';

            // 語系匹配邏輯
            if (userLang.startsWith('zh-tw') || userLang.startsWith('zh-hk') || userLang.startsWith('zh-mo')) {
                target = 'zh-tw';
            } else if (userLang.startsWith('zh')) {
                target = 'zh-cn';
            } else if (userLang.startsWith('ja')) {
                target = 'ja-jp';
            }

            // 執行跳轉 (假設 GitHub Pages 經由 Jekyll 將 .md 轉為 .html)
            // 如果您沒有使用 Jekyll 而是直接放 html 檔案，網址結構維持不變
            window.location.href = "./tos/" + target + ".html";
        })();
    </script>
